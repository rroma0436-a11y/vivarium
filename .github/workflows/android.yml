name: Android APK

on:
  push:
    branches: [ main, master, cleanup ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot і шаблони експорту
        run: |
          set -e
          V=${GODOT_VERSION}
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          unzip -q Godot_v${V}-stable_linux.x86_64.zip
          mv Godot_v${V}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -q Godot_v${V}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/
          rm -f Godot_v${V}-stable_export_templates.tpz

      - name: Ключ для підпису
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Налаштування Android SDK для Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.5.tres
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: Імпорт ресурсів
        run: ./godot --headless --path . --import || ./godot --headless --path . --editor --quit-after 300

      - name: Твій ключ підпису (із секретів)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'observation_alias' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MODE=release" >> $GITHUB_ENV
            echo "Підписую твоїм ключем"
          else
            echo "MODE=debug" >> $GITHUB_ENV
            echo "Секретів немає — тестовий підпис"
          fi

      - name: Збірка APK
        run: |
          mkdir -p build
          ./godot --headless --path . --export-$MODE "Android" build/dyvo-svit-$MODE.apk
          ls -la build
          test -f build/dyvo-svit-$MODE.apk

      - name: Прибрати ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Опублікувати в Releases (швидке завантаження)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/dyvo-svit-$MODE.apk build/dyvo-svit.apk
          NOTES="Автоматична збірка з коміту ${GITHUB_SHA::7} ($MODE)."
          for i in 1 2 3 4 5; do
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest build/dyvo-svit.apk --clobber \
                && gh release edit latest --notes "$NOTES" --target "$GITHUB_SHA" --latest && break
            else
              gh release create latest build/dyvo-svit.apk \
                --title "Диво-Світ — остання збірка" --notes "$NOTES" \
                --target "$GITHUB_SHA" --latest && break
            fi
            echo "спроба $i невдала, повтор"; sleep 8
          done
          gh release view latest >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dyvo-svit-apk
          path: build/dyvo-svit-*.apk
          retention-days: 3
